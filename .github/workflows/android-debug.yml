name: Build Fathermon Un v1.8 APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original game and icons
        run: python3 tools/verify_assets.py
      - name: Compile and lint debug APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fathermon-Un-Soul-Clash-v1.8-debug.apk
          cd dist
          sha256sum Fathermon-Un-Soul-Clash-v1.8-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fathermon-Un-Soul-Clash-v1.8-debug
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
