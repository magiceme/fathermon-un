name: Build Fathermon Un v1.8 APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 build dependencies
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original game and icons
        run: python3 tools/verify_assets.py
      - name: Compile and lint debug APK
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fathermon-Un-Soul-Clash-v1.8-debug.apk
          cd dist
          sha256sum Fathermon-Un-Soul-Clash-v1.8-debug.apk > SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Fathermon-Un-Soul-Clash-v1.8-debug
          path: dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish direct APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.8-debug > /dev/null 2>&1; then
            gh release create v1.8-debug --target "$GITHUB_SHA" --title 'Fathérmon Un: Soul Clash v1.8 (debug)' --notes 'Install the APK below on Android 7.0 or newer. Includes the original offline game and logo. Debug builds require the same signing key to update an existing installation without uninstalling.'
          fi
          gh release upload v1.8-debug dist/Fathermon-Un-Soul-Clash-v1.8-debug.apk dist/SHA256SUMS.txt --clobber
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
